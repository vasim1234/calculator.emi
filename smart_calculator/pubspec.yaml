name: smart_calculator
description: "Smart Calculator - EMI, SIP, FD, GST, BMI, Age & More"
publish_to: 'none'

version: 1.0.1+5

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.1
  path_provider: ^2.1.4
  http: ^1.2.2
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

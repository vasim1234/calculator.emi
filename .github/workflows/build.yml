name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Decode Keystore
        run: |
          mkdir -p smart_calculator/android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > smart_calculator/android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > smart_calculator/android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: |
          cd smart_calculator
          flutter pub get

      - name: Build APK
        run: |
          cd smart_calculator
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-calculator-apk
          path: smart_calculator/build/app/outputs/flutter-apk/app-release.apk
